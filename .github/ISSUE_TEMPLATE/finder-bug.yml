name: Finder bug
description: Something in the popup is wrong, missing or confusing.
title: "[Finder] "
labels: ["bug", "finder"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please do not paste real org data. Component names from your org can be sensitive, so use invented names or blur them in screenshots.

  - type: input
    id: version
    attributes:
      label: Extension version
      description: You find it on chrome://extensions or at the bottom of the popup's help.
      placeholder: "1.4.0"
    validations:
      required: true

  - type: dropdown
    id: flavour
    attributes:
      label: Package flavour
      description: Which OmniStudio the org runs.
      options:
        - Core OmniStudio
        - Managed package (vlocity_cmt, vlocity_ins or vlocity_ps)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What you did and what happened
      description: What you typed or clicked, what you expected and what you saw instead. A screenshot helps (check that it shows no real data).
    validations:
      required: true
